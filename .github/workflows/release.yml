name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv --python 3.12 .venv
      - run: bun install --frozen-lockfile
      - run: sh -n install.sh
      - run: bun run check && bun run test
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'if (process.env.RELEASE_TAG !== `v${(await Bun.file("package.json").json()).version}`) process.exit(1)'
      - run: bun run build:native
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/release/transcribe-darwin-arm64.tar.gz
          dist/release/SHA256SUMS dist/release/install.sh
          --verify-tag --title "transcribe $RELEASE_TAG"
          --generate-notes
